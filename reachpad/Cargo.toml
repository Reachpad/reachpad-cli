[package]
name = "reach"
version.workspace = true
edition.workspace = true
license.workspace = true

# The SHIPPED binary is `reachpad` (the agent-native pivot: the CLI is the
# product interface). The package and lib stay `reach` so `-p reach`,
# `use reach::` and the in-process integration tests are untouched. An
# explicit [[bin]] replaces the auto-discovered `reach` bin, so exactly one
# binary ships.
[[bin]]
name = "reachpad"
path = "src/main.rs"

[features]
# Item 13 parity: reach has no hardware path at all; the feature exists so
# `cargo check -p reach --features hw` compiles like every other bin.
hw = []
# The exact-DER pin of the deterministic dev hub certificate, and the
# `rustls::client::danger::ServerCertVerifier` that implements it
# (`transport::PinnedCert`). OFF by default, and that is the point: the flag
# that used to select it (`--quic-dev-pin`) is gone, `Cli::trust` can no longer
# ask for it, and a certificate-verification override has no business sitting
# in a binary a user installs from Homebrew or npm. The dev-dependency below
# is what turns it on for THIS crate's tests, where a hub with a self-signed
# dev certificate is the subject.
dev-pin = []

[dependencies]
proto.workspace = true
authz.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
bytes.workspace = true
prost.workspace = true
futures.workspace = true
biscuit-auth.workspace = true
# NEW EXTERNAL DEP (pinned here; flagged in the build report): WebSocket
# *client* for `reach tail`. The hub already pins tokio-tungstenite 0.24 as a
# dev-dependency (test client, ADR-0011 note); the CLI needs the client half
# at runtime — §10 BOM names tungstenite for the WS fallback path.
# rustls-tls-webpki-roots: `wss://` to a real hub (ADR-0026) with the same
# rustls the QUIC path uses — no native-tls, no system cert dependency.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# M1: QUIC client path to the real hub endpoint (§6, ADR-0026).
quinn.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
# ADR-0040: `https://` for the control plane, on the same rustls (and the same
# TlsTrust postures) the QUIC data path already uses. Workspace-pinned; hub and
# controld already depend on it, so this adds no crate to the build graph.
tokio-rustls.workspace = true
# Regenerates the deterministic pinned dev hub certificate client-side, for
# the `dev-pin` feature above; byte-equality with hub's is pinned by
# tests/quic_tail.rs. The `--quic-dev-pin` flag that used to reach it is gone.
rcgen.workspace = true
# OS-root certificate verification for quic:// to a real hostname. Already
# in the build graph at this exact version via quinn's default
# `platform-verifier` feature — this direct reference adds no new code.
rustls-platform-verifier = "0.7"
blake3.workspace = true
# `apps`: the snapshot a publish uploads is a gzipped ustar tarball, and `pull`
# reads one back. The tar half is hand-written in `apps::pack` (ustar is 512-byte
# headers and nothing else); the gzip half is not worth hand-writing.
flate2.workspace = true

[dev-dependencies]
# reach depending on reach is not a typo. A dev-dependency on this very
# package is how Cargo (resolver 2) enables a feature for the TEST build of a
# crate and for nothing else: `cargo build` / `cargo install` resolve without
# dev-dependencies and get `dev-pin` off, while `cargo test`, `cargo nextest`
# and `cargo clippy --all-targets` build the lib with it on. `tests/quic_tail.rs`
# needs it — it dials a hub holding the deterministic dev certificate — and
# nothing that ships does.
reach = { path = ".", features = ["dev-pin"] }
# `tokio::test(start_paused = true)`: `connect github` waits ten minutes for a
# ceremony that happens in a browser, and the part worth testing is its pacing
# — three seconds, longer after a failure it could not read, and a deadline.
# On the real clock that test would take as long as the wait it tests. The
# same dev-only feature hub and noded already take for the same reason; it
# ships in no binary.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
