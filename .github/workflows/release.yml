# Release binaries, built FROM THIS REPOSITORY's source on GitHub's runners.
# The provenance chain a user can check: this workflow run links the tag, the
# tag names a commit whose source is readable here, and SHA256SUMS in the
# release matches the tarballs. Nothing is built anywhere private.
#
# Tags arrive from the source-of-truth sync (the private reachpad-infra repo
# pushes a snapshot and its cli-v* tag together).
#
# Three things leave this workflow: a GitHub release, five npm packages, and
# nothing else. The npm packages carry these same binaries — see npm/README.md
# for why that install path exists at all (short version: npm never stamps
# com.apple.quarantine, so an ad-hoc signed binary installed that way does not
# meet Gatekeeper).
name: release
on:
  push:
    tags: ["cli-v*"]
permissions:
  contents: write
jobs:
  build:
    # The signing key lives HERE, not in repository secrets, and the
    # difference is the whole security posture of this workflow.
    #
    # A repository secret is readable by any workflow in the repository, on
    # any branch, including one added in a push by anybody with write access.
    # For an ordinary token that is a bad day; for an Apple Developer ID key
    # it is an attacker signing malware that macOS trusts as us, which is the
    # failure that ends a software company's reputation and cannot be undone
    # by rotating anything — every binary ever signed has to be re-released.
    #
    # An environment secret is readable only by a job that names the
    # environment, and only after the environment's rules pass. Ours are:
    # deployments allowed from `cli-v*` TAGS only (not from any branch), and
    # a required human reviewer. So the key is reachable exclusively by a
    # tagged release that a person approved, and never by a workflow someone
    # pushed to a branch.
    #
    # This gates the Linux legs too. That is deliberate: nothing in a release
    # should ship without the same approval, and one click per release is not
    # a cost worth engineering around.
    environment: release-signing
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          # Cross-compiled from the same arm64 runner: the macOS SDK carries
          # both slices, so this needs a target, not a second machine.
          - target: x86_64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain, so the cross target must be
      # added to the PIN, not to whatever stable an action would install.
      - name: toolchain (the rust-toolchain.toml pin) + cross target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: install protoc (crates/proto build dependency)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
          else
            sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools
          fi
      # --locked is the difference between "built from this source" and "built
      # from this source and these exact dependency versions". Without it cargo
      # re-resolves on the runner, so the committed lock describes nothing that
      # was ever built, two builds of ONE tag can differ, and a transitive
      # dependency that publishes a semver-compatible release between them is
      # picked up with nobody deciding to. That is the hole the provenance
      # claim at the top of this file must not have. It fails loudly if the
      # lock and the manifest ever disagree again, which is the point.
      - name: build
        run: cargo build --release --locked -p reach --target ${{ matrix.target }}

      # --- macOS: Developer ID signature + notarization ---------------------
      #
      # Without this the binary is only ad-hoc signed (the linker's own
      # signature). Ad-hoc is enough to EXECUTE on Apple silicon, which is why
      # `brew install` and the curl installer work today — neither stamps
      # com.apple.quarantine. It is NOT enough for anything that does stamp it:
      # a browser download from the releases page hits "Apple could not verify
      # reachpad is free of malware", and no amount of packaging fixes that.
      # Only a Developer ID signature that Apple has notarized clears it.
      #
      # The step is skipped, loudly, when the secrets are absent, because the
      # alternative is a release that silently ships unsigned binaries under a
      # workflow that claims to sign them. Set up (once):
      #
      #   MACOS_CERTIFICATE      base64 of the Developer ID Application .p12
      #   MACOS_CERTIFICATE_PWD  its export password
      #   MACOS_SIGN_IDENTITY    e.g. "Developer ID Application: … (TEAMID)"
      #   MACOS_NOTARY_KEY       base64 of the App Store Connect .p8 key
      #   MACOS_NOTARY_KEY_ID    the key id
      #   MACOS_NOTARY_ISSUER    the issuer uuid
      #
      # .github/MACOS-SIGNING.md is the runbook that produces all six — on
      # Linux, with openssl, no Mac involved — and says what this does and
      # does not fix before you spend $99 on it.
      - name: sign and notarize (macOS, when the signing secrets exist)
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          BINARY: target/${{ matrix.target }}/release/reachpad
        run: |
          # All six or none. Signing with a certificate and then failing to
          # notarize is the WORST outcome available here: it produces a
          # Developer ID binary that Gatekeeper still refuses, and it refuses
          # it with the same dialog as the unsigned one — so the release looks
          # signed, the secrets look configured, and the symptom is unchanged.
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD MACOS_SIGN_IDENTITY \
                      MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER; do
            case "$name" in
              MACOS_CERTIFICATE)     value="$CERT" ;;
              MACOS_CERTIFICATE_PWD) value="$CERT_PWD" ;;
              MACOS_SIGN_IDENTITY)   value="$IDENTITY" ;;
              MACOS_NOTARY_KEY)      value="$NOTARY_KEY" ;;
              MACOS_NOTARY_KEY_ID)   value="$NOTARY_KEY_ID" ;;
              MACOS_NOTARY_ISSUER)   value="$NOTARY_ISSUER" ;;
            esac
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ] && [ -z "$CERT$CERT_PWD$IDENTITY$NOTARY_KEY$NOTARY_KEY_ID$NOTARY_ISSUER" ]; then
            echo "::warning title=Unsigned macOS binary::None of the MACOS_* signing secrets are set. This release ships an ad-hoc signed binary: it runs from brew, npm and the curl installer, but a browser download from the releases page will be blocked by Gatekeeper. See the comment in .github/workflows/release.yml."
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Signing is half-configured::Missing:$missing. Signing without notarizing produces a binary Gatekeeper still refuses, with the same dialog as an unsigned one — so this fails instead of shipping something that looks fixed."
            exit 1
          fi
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"

          # --options runtime is what notarization requires; --timestamp is
          # what keeps the signature valid after the certificate expires.
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"

          # A POST-CONDITION, not a formality. `codesign --sign` accepts an
          # identity string that resolves to the wrong certificate, and
          # --verify then passes happily against it: an ad-hoc or a plain
          # "Apple Development" signature verifies fine and is refused by
          # Gatekeeper exactly like no signature at all. The only thing that
          # clears quarantine is a Developer ID Application authority, so that
          # is what gets asserted before this release is allowed to continue.
          authority="$(codesign -dv --verbose=4 "$BINARY" 2>&1 | grep '^Authority=' | head -1)"
          case "$authority" in
            *"Developer ID Application"*) echo "signed: $authority" ;;
            *)
              echo "::error title=Wrong signing certificate::MACOS_SIGN_IDENTITY resolved to ${authority:-no authority at all}, not a Developer ID Application certificate. Gatekeeper refuses that the same way it refuses an unsigned binary."
              exit 1
              ;;
          esac

          # notarytool takes an archive, not a bare executable.
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k "$BINARY" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8"

          # A bare Mach-O cannot be stapled — the ticket has nowhere to live.
          # Gatekeeper falls back to an online notarization check instead,
          # which is why this workflow does not attempt `stapler staple`.
          echo "signed and notarized: $(codesign -dv --verbose=4 "$BINARY" 2>&1 | grep -i '^Authority' | head -1)"

      - name: package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf reachpad-${{ matrix.target }}.tar.gz reachpad
          shasum -a 256 reachpad-${{ matrix.target }}.tar.gz > reachpad-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: reachpad-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/reachpad-*.tar.gz
            target/${{ matrix.target }}/release/reachpad-*.tar.gz.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # the OIDC claim the attestation is signed against
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: combined checksum file
        run: cat *.sha256 > SHA256SUMS

      # Build provenance: a signed, publicly verifiable statement that these
      # exact bytes came out of THIS workflow, at THIS commit, in THIS repo.
      #
      # This is the half of the problem Apple cannot solve for us. A Developer
      # ID signature says "Reachpad signed this"; it says nothing about what
      # was signed or where it came from, and it depends on a private key that
      # somebody could steal. This depends on no key at all — the signing
      # identity is a short-lived OIDC credential GitHub mints for this run,
      # and the record goes into a public transparency log, so a forged
      # attestation would have to be forged in public.
      #
      # It also covers Linux, which has no Gatekeeper and therefore no reason
      # anyone would ever have signed those tarballs.
      #
      #   gh attestation verify reachpad-<target>.tar.gz --repo Reachpad/reachpad-cli
      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "*.tar.gz"
      # The body carries the macOS quarantine note on purpose. Downloading a
      # tarball from THIS page in a browser is the one install path that
      # stamps com.apple.quarantine, and until the binaries are notarized it
      # is also the one that meets Gatekeeper. Someone who hits "Apple could
      # not verify reachpad is free of malware" with no explanation next to
      # the download concludes the binary is malware, not that it is unsigned.
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            ## Install

            ```sh
            brew install reachpad/tap/reachpad     # macOS, Linux
            npm install -g @reachpad/cli           # anywhere Node 18+ runs
            curl -fsSL https://reachpad.dev/install | sh
            ```

            All three deliver the binaries below, and none of them hits the
            macOS warning described next.

            ## Downloading a tarball here, on macOS

            These binaries are ad-hoc signed, not yet Developer ID signed and
            notarized. A **browser** download tags the file with
            `com.apple.quarantine`, and macOS then refuses it with "Apple
            could not verify reachpad is free of malware". The file is fine —
            it is unsigned, not unsafe — and any of the three commands above
            avoids the tag entirely. If you want this exact tarball anyway:

            ```sh
            shasum -a 256 -c SHA256SUMS --ignore-missing
            xattr -d com.apple.quarantine reachpad
            ```

            Verify the checksum first, as above; that is the check the
            signature would otherwise be doing for you.

            ## Verifying where these came from

            Every tarball carries a signed build-provenance attestation: proof
            that these exact bytes came out of this repository's release
            workflow, at the commit this tag names. It needs no key of ours —
            the record lives in a public transparency log.

            ```sh
            gh attestation verify reachpad-<target>.tar.gz --repo Reachpad/reachpad-cli
            ```

  # The same binaries, on npm. Separate job so a registry outage cannot lose
  # the GitHub release, and `needs: publish` so npm never advertises a version
  # whose release page does not exist yet.
  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing: the whole mechanism
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      # Node 22 ships npm 10, which predates OIDC publishing entirely. A floor
      # rather than @latest, so a future npm cannot change a release out from
      # under us on an unrelated day.
      - name: npm new enough to speak OIDC
        run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: the release's own checksums, not the artifacts' word for it
        run: |
          cd artifacts && cat *.sha256 > SHA256SUMS && ls -l
      # BEFORE prepare.mjs, not after. One of these tests asserts that every
      # manifest still reads 0.0.0-dev -- that the repo carries no real version
      # and the tag is the only source. prepare.mjs's whole job is to stamp the
      # real version into those manifests, so running the suite afterwards
      # asserts the opposite of what prepare.mjs just did and fails by
      # construction, on every tag, forever. cli-v0.4.0 is where that was
      # noticed: the job died here, two steps before the publish that was the
      # point, and took the "has never been published" diagnostic below with it.
      - run: node --test npm/test/*.test.mjs
      - name: stamp the tag's version and stage the binaries
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          node npm/prepare.mjs --version "$version" --artifacts artifacts
      # Idempotent on purpose: five publishes in a row, and the fourth failing
      # must leave a re-runnable tag rather than a half-published version that
      # npm then refuses to accept again. The platform packages go FIRST —
      # @reachpad/cli names them as optional dependencies, and a main package
      # published before them is one npm resolves to nothing for a while.
      - name: publish
        run: |
          version=$(node -p "require('./npm/cli/package.json').version")
          for dir in darwin-arm64 darwin-x64 linux-x64 linux-arm64 cli; do
            name=$(node -p "require('./npm/$dir/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; leaving it alone"
              continue
            fi
            # ./npm/$dir, not npm/$dir. npm resolves a publish argument as a
            # package SPEC, and a bare `npm/cli` is not a path to npm -- it is
            # the GitHub shorthand `<org>/<repo>`, so npm clones
            # github.com/npm/cli and publishes THAT (the npm CLI itself). The
            # first iteration, `npm/darwin-arm64`, is a repository that does
            # not exist, so this loop died on a git error about a public key
            # while looking like an auth problem with our own registry. Only a
            # spec starting with `.`, `/`, or `~/` is read as a directory.
            if npm publish "./npm/$dir"; then
              continue
            fi
            # A publish can fail for ordinary reasons, but there is exactly one
            # that is guaranteed to happen once and reads as an unrelated auth
            # error when it does: npm Trusted Publishing can only be configured
            # on a package that ALREADY EXISTS, so the first version of each of
            # these five has to be pushed by hand. Say so here rather than
            # leaving ENEEDAUTH next to a green release.
            if ! npm view "$name" version >/dev/null 2>&1; then
              echo "::error title=$name has never been published::OIDC cannot publish a package that does not exist yet. Publish each of the five once by hand, then configure the trusted publisher for each at npmjs.com (Settings -> Trusted Publisher -> GitHub Actions; org Reachpad, repo reachpad-cli, workflow release.yml, environment blank). The commands are in npm/README.md. Re-running this tag afterwards is safe: publishes already done are skipped."
            fi
            exit 1
          done
