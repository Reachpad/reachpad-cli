# GENERATED by reachpad-infra scripts/release/assemble-cli-repo.sh — the
# private repo is the source of truth and every cli-v* release re-syncs
# this snapshot. Patches are welcome as issues; a PR here will be ported,
# not merged, because the next sync would overwrite it.

[workspace]
resolver = "2"
members = ["reachpad", "crates/proto", "crates/authz"]

[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/Reachpad/reachpad-cli"

[workspace.dependencies]
proto = { path = "crates/proto" }
authz = { path = "crates/authz" }
anyhow = "1"
base64 = "0.22"
biscuit-auth = "5"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
futures = "0.3"
hex = "0.4"
proptest = "1"
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
quinn = "0.11"
rcgen = { version = "0.14", features = ["pem", "crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"

# What customers download. Stripped: a shipped CLI carries no debugger.
[profile.release]
strip = true
lto = "thin"

[workspace.lints.rust]
unsafe_code = "deny"
[workspace.lints.clippy]
disallowed_methods = "allow"
